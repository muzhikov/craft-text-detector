name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'

    - name: Install PyTorch on Linux
      if: matrix.os == 'ubuntu-latest'
      run: pip install torch==2.13.0+cpu torchvision==0.28.0+cpu --index-url https://download.pytorch.org/whl/cpu

    - name: Install PyTorch on MacOS and Windows
      if: matrix.os == 'macos-latest' || matrix.os == 'windows-latest'
      run: pip install torch==2.13.0 torchvision==0.28.0

    - name: Install requirements
      run: pip install -r requirements.txt

    - name: Restore HuggingFace hub cache (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache@v6
      with:
        path: ~/.cache/huggingface/hub
        key: ${{ matrix.os }}-hf-hub
    - name: Restore HuggingFace hub cache (MacOS)
      if: matrix.os == 'macos-latest'
      uses: actions/cache@v6
      with:
        path: ~/.cache/huggingface/hub
        key: ${{ matrix.os }}-hf-hub
    - name: Restore HuggingFace hub cache (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/cache@v6
      with:
        path: ~\.cache\huggingface\hub
        key: ${{ matrix.os }}-hf-hub

    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Test with unittest
      run: |
        python -m unittest
